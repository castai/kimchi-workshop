name: Per-commit colleague narration

# When a participant's CI completes (score-pr.yml or production.yml),
# this workflow fires and drops TWO emails into the participant's site
# inbox: an immediate "glanced at the diff, taking a look" note, and a
# "here's where you stand" synthesis once results are in. Tone shifts
# from wry to congratulatory based on how the run went.
on:
  workflow_run:
    workflows: ["score-pr.yml", "Production scenario"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  narrate:
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the narration script from the answers repo
        uses: actions/checkout@v4
        with:
          repository: castai/kimchi-workshop-answers
          ref: verification
          path: answers/
          token: ${{ secrets.ANSWERS_REPO_PAT }}
          persist-credentials: false

      - name: Build and send the narration email
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -e
          mkdir -p .verification
          cp answers/.verification/commit_narration.py .verification/commit_narration.py
          python3 .verification/commit_narration.py

          git config user.name "kimchi-workshop-bot"
          git config user.email "bot@users.noreply.github.com"
          git add personal/
          git commit -m "Inbox: per-commit narration for ${{ github.event.workflow_run.head_branch }}" || echo "nothing"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
