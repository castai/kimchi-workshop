name: kimchi-workshop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q --tb=short

  leaderboard:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild leaderboard from submissions
        run: |
          pip install -r requirements.txt
          python scripts/leaderboard.py --submissions submissions/ --out leaderboard.json
      - name: Commit leaderboard
        run: |
          git config user.name "workshop-bot"
          git config user.email "workshop-bot@users.noreply.github.com"
          git add leaderboard.json || true
          git commit -m "Rebuild leaderboard" || echo "nothing to commit"
          git push || echo "no changes to push"
