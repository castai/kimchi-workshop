name: Production report

# SECURITY NOTE (Wiz finding 2026-10-27, severity: Critical): this workflow
# previously ran pytest directly against untrusted PR code while holding
# pull_request_target secrets. That is a textbook PWN request: any participant
# could smuggle code into their PR (conftest.py, app.py, any module imported
# by the test suite) and exfiltrate KIMCHI_API_KEY, plus every org-level
# secret reachable through a pull_request_target GITHUB_TOKEN.
#
# The test execution moves to score-pr.yml on pull_request: (read-only
# GITHUB_TOKEN against the fork, no org secrets). THIS workflow runs
# afterwards via workflow_run: it has the secrets, but it NEVER checks out
# PR code, NEVER installs anything from the PR, NEVER imports PR code. The
# only action on participant input is reading the published JUnit XML +
# score.json artifact produced by the earlier run.

on:
  workflow_run:
    workflows: ["Score submission PR"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read  # needed to download artifacts from the triggering run

env:
  KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}

jobs:
  production:
    # Triggered by every successful score run. The [submission] gate runs
    # INSIDE the job from score.json: for runs triggered by fork PRs (the
    # workshop requires "fork first"), workflow_run.pull_requests is empty,
    # so the event payload cannot supply the PR title, number or author.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # Test execution happened in the upstream workflow. We only read the
      # published artifacts. No checkout of PR code anywhere.
      # Explicit `path:` so files land where the rest of the job reads them.
      - name: Download score artifact from the scoring run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: submission-score
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/score

      - name: Download production report artifact from the scoring run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: submission-prod-score
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/prod

      # score.json is written by scripts/score_pr.py in the scoring run and
      # carries pr, pr_url, pr_title and github (the author's handle).
      # SECURITY: score.json is produced in a run that executes PR code
      # (score-pr.yml checks out the PR head and pytest loads PR conftest/
      # modules), so a participant can overwrite the artifact's contents.
      # These values are template-substituted into privileged shell/JS below
      # (${{ steps.meta.outputs.* }}), so every value is validated against a
      # strict allowlist BEFORE it reaches GITHUB_OUTPUT. Anything that fails
      # validation marks the run as non-submission: all side-effecting steps
      # gate on is_submission and treat the values as untrusted either way.
      - name: Read submission metadata from the score artifact
        id: meta
        run: |
          python3 - <<'EOF'
          import json, os, re

          d = {}
          title = ''
          if os.path.exists('artifacts/score/score.json'):
              try:
                  with open('artifacts/score/score.json') as f:
                      d = json.load(f)
              except (ValueError, OSError) as e:
                  print(f"::warning::score.json unreadable ({e}); treating run as non-submission")
                  d = {}
              title = str(d.get('pr_title', '') or '')

          pr = d.get('pr')
          sender = str(d.get('github', '') or '')
          pr_url = str(d.get('pr_url', '') or '')

          # GitHub login: 1-39 chars, alphanumeric/hyphen, no leading hyphen.
          LOGIN = re.compile(r'[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})?')
          PR_URL = re.compile(r'https://github\.com/castai/kimchi-workshop/pull/[0-9]+')

          ok = (
              title.startswith('[submission]')
              and '\n' not in title and '\r' not in title
              and type(pr) is int and pr > 0
              and LOGIN.fullmatch(sender) is not None
              and PR_URL.fullmatch(pr_url) is not None
          )

          if not ok:
              print("::warning::score.json metadata missing or failed validation; "
                    "no side effects will run")
              pr_number = pr_title = sender = pr_url = ''
          else:
              pr_number, pr_title = str(pr), title

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"pr_number={pr_number}\n")
              f.write(f"pr_title={pr_title}\n")
              f.write(f"sender={sender}\n")
              f.write(f"pr_url={pr_url}\n")
              f.write(f"is_submission={'true' if ok else 'false'}\n")
          print(f"PR title: {title}")
          print(f"is_submission={ok}")
          EOF

      # Trust PROVENANCE, not artifact content. prod_log.md comes from a
      # run that executes PR code (score-pr.yml checks out the PR head and
      # participants control .verification/ at test time), so a fork PR can
      # simply write "Production score: 26/26" into the artifact. The marker
      # contract alone is therefore forgeable. Only same-repo runs can ever
      # hold HIDDEN_TESTS_GIST, so: fork run => the log can never be real
      # production data, regardless of what it says.
      - name: Detect production data availability
        id: data
        env:
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          LOG=artifacts/prod/prod_log.md
          PROD_DATA=unavailable
          REASON=broken-log
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            # Fork run: secrets are withheld, the hidden suite was never
            # fetched, and the artifact log is untrusted PR output.
            REASON=fork
          elif [ -f "$LOG" ] \
            && ! grep -q 'PRODUCTION_SUITE: UNAVAILABLE' "$LOG" \
            && grep -qE 'Production score: [0-9]+/[0-9]+' "$LOG"; then
            PROD_DATA=available
            REASON=ok
          else
            # Same-repo run with no parseable real log: the hidden suite
            # crashed or formatting failed. This is an operational break,
            # not a participant state - surface it instead of mislabeling
            # it as the fork case.
            echo "::warning::production run produced no parseable log for a same-repo submission; framing/auto-review skipped, facilitator should investigate"
          fi
          echo "prod_data=$PROD_DATA" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "prod_data=$PROD_DATA reason=$REASON"

          # Visible-suite numbers for the honest status comment. score.json
          # comes from a run that executes PR code, so sanitize both values
          # to plain integers before they reach a PR comment.
          V_LABEL=unavailable
          if [ -f artifacts/score/score.json ]; then
            VP=$(python3 -c "import json;d=json.load(open('artifacts/score/score.json'));print('%s %s' % (d.get('tests_passed'), d.get('tests_failed')))" 2>/dev/null || true)
            set -- $VP
            V_PASS=${1:-}
            V_FAIL=${2:-}
            if [ -n "$V_PASS" ] && [ -n "$V_FAIL" ]; then
              case "$V_PASS$V_FAIL" in
                *[!0-9]*) : ;;
                *) V_LABEL="$V_PASS/$((V_PASS + V_FAIL))" ;;
              esac
            fi
          fi
          echo "visible_label=$V_LABEL" >> "$GITHUB_OUTPUT"
          echo "visible_label=$V_LABEL"

      - name: Pick rotating SRE sender
        id: sender
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          FIRST_OCTET=$(( 16#${HEAD_SHA:0:2} ))
          IDX=$(( FIRST_OCTET % 5 ))
          case "$IDX" in
            0)
              NAME="Priya Nair"
              BG="#5b2c6f"
              TONE="formal, incident-review style, clipped sentences, methodical with a preference for bullet summaries"
              ;;
            1)
              NAME="Marcus Webb"
              BG="#1a5276"
              TONE="dry sarcasm, conversational and blunt, mild exasperation at repeated mistakes"
              ;;
            2)
              NAME="Ingrid Sorensen"
              BG="#145a32"
              TONE="engineering-calm, structured, prefers numbered lists, cuts directly to what matters"
              ;;
            3)
              NAME="Derek Aoki"
              BG="#7e5109"
              TONE="enthusiastic and encouraging, generous with exclamation marks (no em dashes), celebrates small wins"
              ;;
            4)
              NAME="Helena Vasquez"
              BG="#7b241c"
              TONE="terse, security-paranoid, no nonsense, treats every missed secret leak as a personal insult"
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "bg=$BG" >> "$GITHUB_OUTPUT"
          echo "tone=$TONE" >> "$GITHUB_OUTPUT"
          echo "Picked SRE #$IDX: $NAME"

      - name: "Gate: production score must be at least 15/26"
        if: steps.data.outputs.prod_data == 'available'
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import re, sys, os
          if not os.path.exists('artifacts/prod/prod_log.md'):
              print("No production log found.")
              sys.exit(1)
          out = open('artifacts/prod/prod_log.md').read()
          m = re.search(r"Production score: (\d+)/(\d+)", out)
          if not m:
              print("No production score found in log.")
              sys.exit(1)
          passed, total = int(m.group(1)), int(m.group(2))
          if passed < 15:
              print(f"::error::Production score {passed}/{total} below the merge threshold (15). "
                    "Fix the failing areas the log reports and re-run.")
              sys.exit(1)
          print(f"Production gate passed: {passed}/{total}")
          EOF

      - name: Frame production log as an email via Kimchi
        if: always() && steps.meta.outputs.is_submission == 'true' && steps.data.outputs.prod_data == 'available'
        env:
          KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRE_SENDER_NAME: ${{ steps.sender.outputs.name }}
          SRE_TONE: ${{ steps.sender.outputs.tone }}
        continue-on-error: true
        run: |
          curl -sSfL \
            -H "Authorization: Bearer ${{ secrets.ANSWERS_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o frame_email.py \
            "https://api.github.com/repos/castai/kimchi-workshop-answers/contents/.verification/frame_email.py?ref=verification" \
            || cp artifacts/prod/prod_log.md prod_email_body.txt
          [ -f prod_email_body.txt ] && exit 0
          python3 frame_email.py \
            --input artifacts/prod/prod_log.md \
            --output prod_email_body.txt \
            --sender-name "$SRE_SENDER_NAME" \
            --tone "$SRE_TONE" \
          || cp artifacts/prod/prod_log.md prod_email_body.txt

      - name: Frame production log as a technical PR comment
        if: always() && steps.meta.outputs.is_submission == 'true' && steps.data.outputs.prod_data == 'available'
        env:
          KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          curl -sSfL \
            -H "Authorization: Bearer ${{ secrets.ANSWERS_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o frame_pr_comment.py \
            "https://api.github.com/repos/castai/kimchi-workshop-answers/contents/.verification/frame_pr_comment.py?ref=verification" \
            || cp artifacts/prod/prod_log.md prod_pr_comment.txt
          [ -f prod_pr_comment.txt ] && exit 0
          python3 frame_pr_comment.py artifacts/prod/prod_log.md prod_pr_comment.txt \
            || cp artifacts/prod/prod_log.md prod_pr_comment.txt
          cat prod_pr_comment.txt

      - name: Post production log on the PR
        if: always() && steps.meta.outputs.is_submission == 'true' && steps.data.outputs.prod_data == 'available'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let bodyFile = null;
            if (fs.existsSync("prod_pr_comment.txt")) {
              bodyFile = "prod_pr_comment.txt";
            } else if (fs.existsSync("artifacts/prod/prod_log.md")) {
              bodyFile = "artifacts/prod/prod_log.md";
            }
            const body = bodyFile ? fs.readFileSync(bodyFile, "utf8") : "Could not parse production results.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.meta.outputs.pr_number }},
              body,
            });

      # No real production data: post ONE static, accurate status comment
      # instead of an LLM-framed report. No fabricated scores, no invented
      # fix lists; facilitator acceptance remains the documented decision
      # (workshop/FACILITATOR.md).
      - name: Post honest production status on the PR
        if: always() && steps.meta.outputs.is_submission == 'true' && steps.data.outputs.prod_data == 'unavailable'
        env:
          VISIBLE_LABEL: ${{ steps.data.outputs.visible_label }}
          PROD_REASON: ${{ steps.data.outputs.reason }}
        uses: actions/github-script@v7
        with:
          script: |
            const label = process.env.VISIBLE_LABEL || "unavailable";
            const visible = label !== "unavailable"
              ? `Visible suite: **${label}** passing (from the scoring run).`
              : "Visible suite: result unavailable (check the Score submission PR run).";
            const prod = process.env.PROD_REASON === "fork"
              ? "Production suite: **not run** — the hidden scenario suite is not available to fork PR runs (CI secrets are withheld from forks by design), so no production score was produced for this push. Any score-like text in the build artifacts is untrusted and ignored."
              : "Production suite: **produced no parseable report** — a same-repo run should have had real data, so a facilitator has been asked (via a job warning) to investigate. Auto-review is skipped until a real production log exists.";
            const body = [
              "## Production report — not run for this push",
              "",
              visible,
              prod,
              "",
              "Nothing above is a real failure. Auto-review gating is skipped when there is no production data; a facilitator reviews and applies the `accepted` label per `workshop/FACILITATOR.md`.",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.meta.outputs.pr_number }},
              body,
            });

      - name: Publish production log to the participant's site inbox
        if: always() && steps.meta.outputs.is_submission == 'true' && steps.data.outputs.prod_data == 'available'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRE_SENDER_NAME: ${{ steps.sender.outputs.name }}
          SRE_SENDER_BG: ${{ steps.sender.outputs.bg }}
        run: |
          set -e
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/castai/kimchi-workshop.git" site
          cd site
          git config user.name "kimchi-workshop-bot"
          git config user.email "bot@users.noreply.github.com"
          # Prefer the persona-framed email; fall back to the raw log, then
          # to a placeholder if the scoring run produced no report at all.
          BODY_FILE="../prod_email_body.txt"
          if [ ! -s "$BODY_FILE" ]; then
            BODY_FILE="../artifacts/prod/prod_log.md"
          fi
          if [ ! -s "$BODY_FILE" ]; then
            printf 'The production run did not produce a report. The facilitator has been notified.\n' > /tmp/no_report.txt
            BODY_FILE=/tmp/no_report.txt
          fi
          test -f append_personal_mail.py
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          python3 append_personal_mail.py \
            --site-dir . \
            --handle "${{ steps.meta.outputs.sender }}" \
            --id "prod-log-pr-${{ steps.meta.outputs.pr_number }}-${SHORT_SHA}" \
            --from-name "$SRE_SENDER_NAME" \
            --from-role "SRE on-call" \
            --from-bg "$SRE_SENDER_BG" \
            --subject "Re: deployment - production is unhappy again" \
            --category production \
            --body-file "$BODY_FILE" \
            --pr-url "${{ steps.meta.outputs.pr_url }}"
          git add "personal/${{ steps.meta.outputs.sender }}.json"
          git commit -m "Inbox: production report for @${{ steps.meta.outputs.sender }} (PR #${{ steps.meta.outputs.pr_number }}, by $SRE_SENDER_NAME)" || echo "nothing to commit"
          git push origin gh-pages

      - name: Upload production score
        if: steps.meta.outputs.is_submission == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-score
          path: artifacts/prod/prod_log.md

      - name: Auto-review gates and label
        if: always() && steps.meta.outputs.is_submission == 'true' && steps.data.outputs.prod_data == 'available'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}
          KIMCHI_REVIEW_MODEL: ${{ secrets.KIMCHI_REVIEW_MODEL }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        id: review
        run: |
          set -e
          PR_BODY=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json body --jq '.body')

          # Visible suite score, read from the already-downloaded score.json.
          VISIBLE_TOTAL=9
          V_PASS=0
          if [ -f artifacts/score/score.json ]; then
            V_PASS=$(python3 -c "import json;d=json.load(open('artifacts/score/score.json'));print(d.get('tests_passed',0))")
            VISIBLE_TOTAL=$(python3 -c "import json;d=json.load(open('artifacts/score/score.json'));print(d.get('tests_passed',0)+d.get('tests_failed',0))")
          fi

          curl -sSfL \
            -H "Authorization: Bearer ${{ secrets.ANSWERS_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o auto_review.py \
            "https://api.github.com/repos/castai/kimchi-workshop-answers/contents/.verification/auto_review.py?ref=verification" || {
              echo "::error::could not fetch auto_review.py; review bypassed"
              exit 1
            }
          # auto_review.py (fetched from the answers repo) reads prod_log.md
          # from the workspace root; the artifact landed in artifacts/prod/.
          # Bridge the path; if the log is genuinely absent the script's own
          # error stays loud rather than the run silently passing.
          [ -f artifacts/prod/prod_log.md ] && cp artifacts/prod/prod_log.md prod_log.md || true

          V_PASS="$V_PASS" V_TOTAL="$VISIBLE_TOTAL" PR_BODY="$PR_BODY" python3 auto_review.py

      - name: Act on auto-review verdict
        if: always() && steps.meta.outputs.is_submission == 'true' && steps.data.outputs.prod_data == 'available'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          ACCEPT: ${{ steps.review.outputs.accept }}
          FAILURES: ${{ steps.review.outputs.failures }}
          V_PASS: ${{ steps.review.outputs.vpass }}
          V_TOTAL: ${{ steps.review.outputs.vtotal }}
          PROD_SCORE: ${{ steps.review.outputs.prod_score }}
        run: |
          set -e

          find_prior() {
            gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
              --json comments --jq '.comments[] | select(.author.login == "github-actions[bot]" and (.body | startswith("Auto-review") or startswith("Auto-accepted"))) | .id' \
              | tail -1
          }
          PRIOR_ID=$(find_prior || true)
          if [ -n "$PRIOR_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$PRIOR_ID" -X DELETE || echo "prior verdict delete skipped"
          fi

          PROD_SCORE_INT=${PROD_SCORE:-0}
          REQUIRED_PROD=15
          REMAINING=$((REQUIRED_PROD - PROD_SCORE_INT))
          if [ "$REMAINING" -lt 0 ]; then REMAINING=0; fi

          if [ "$ACCEPT" = "yes" ]; then
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" \
              -X POST -f "labels[]=accepted" || echo "label add skipped"
            printf 'Auto-accepted by the workshop bot.\n\n- Visible suite: %s/%s\n- Production: %s/26 (need %s)\n- CSV matches the reported cost.\n\nThe leaderboard workflow runs next; Sam Carter will mail your inbox once the row lands.\n' \
              "$V_PASS" "$V_TOTAL" "$PROD_SCORE" "$REQUIRED_PROD" > /tmp/accept_body.txt
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/accept_body.txt
          else
            WHATS_LEFT="**Fix ${REMAINING} more production checks to clear the 15/26 gate.**"
            {
              printf 'Auto-review blocked. Fix and push again.\n\n'
              printf '%s\n\n' "$WHATS_LEFT"
              printf '**Blocking:**\n'
            } > /tmp/block_body.txt
            echo "$FAILURES" | tr ';' '\n' | sed 's/^/- /' | grep -v '^- $' >> /tmp/block_body.txt
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/block_body.txt
          fi
