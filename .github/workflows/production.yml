name: Production scenario

# Runs against every submission PR in parallel with the visible score.
# The hidden suite is fetched from the private kimchi-workshop-answers
# repo - participants never see the tests, only the production log
# rendered from their results.
#
# pull_request_target: runs in the context of the BASE repository so it
# can read the ANSWERS_REPO_PAT secret. Fork PRs cannot see secrets on
# standard `pull_request` events; this event is the documented pattern
# for workflows that need secrets AND should run for external contributors.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

env:
  KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}

jobs:
  production:
    # Only run against participant submissions. Housekeeping PRs skip.
    if: startsWith(github.event.pull_request.title, '[submission]')
    runs-on: ubuntu-latest
    steps:
      # Check out the PR's HEAD sha explicitly - safe because this workflow
      # only reads test results (never runs the untrusted code in a context
      # with write permissions that could modify the repo).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pytest

      - name: Fetch hidden suite from the private answers repo
        uses: actions/checkout@v4
        with:
          repository: castai/kimchi-workshop-answers
          ref: verification
          path: answers/
          token: ${{ secrets.ANSWERS_REPO_PAT }}
          persist-credentials: false
          sparse-checkout: .verification
          # required for fork PRs: surface the real error if the PAT
          # cannot see the answers repo
          allow-unsafe-pr-checkout: true

      - name: Stage hidden suite
        run: |
          mkdir -p .verification
          cp answers/.verification/test_hidden.py .verification/
          cp answers/.verification/format_prod_log.py .verification/

      - name: Run production scenario
        id: prod
        run: |
          set +e
          python -m pytest .verification/test_hidden.py -q \
            --junitxml=/tmp/prod.xml --tb=line -p no:cacheprovider
          echo "exit=$?" >> $GITHUB_OUTPUT
          python .verification/format_prod_log.py /tmp/prod.xml prod_log.md
          python - <<'EOF'
          import re
          out = open("prod_log.md").read()
          m = re.search(r"Production score: (\d+)/(\d+)", out)
          if m:
              print("passed=" + m.group(1))
              print("total=" + m.group(2))
          EOF
          cat prod_log.md

      - name: Frame production log as an email via Kimchi
        env:
          KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}
        continue-on-error: true
        run: |
          cp answers/.verification/frame_email.py .verification/frame_email.py
          python3 .verification/frame_email.py prod_log.md prod_email_body.txt
          cat prod_email_body.txt

      - name: "Gate: production score must be at least 20/26"
        run: |
          python3 - <<'EOF'
          import re, sys
          out = open("prod_log.md").read()
          m = re.search(r"Production score: (\d+)/(\d+)", out)
          if not m:
              print("No production score found in log.")
              sys.exit(1)
          passed, total = int(m.group(1)), int(m.group(2))
          if passed < 20:
              print(f"::error::Production score {passed}/{total} below the merge threshold (20). "
                    "Fix the failing areas the log reports and re-run.")
              sys.exit(1)
          print(f"Production gate passed: {passed}/{total}")
          EOF

      - name: Post production log on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const bodyFile = fs.existsSync("prod_email_body.txt")
              ? "prod_email_body.txt" : "prod_log.md";
            const body = fs.readFileSync(bodyFile, "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Publish production log to the participant's site inbox
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/castai/kimchi-workshop.git" site
          cd site
          git config user.name "kimchi-workshop-bot"
          git config user.email "bot@users.noreply.github.com"
          BODY_FILE="../prod_email_body.txt"
          if [ ! -s "$BODY_FILE" ]; then
            BODY_FILE="../prod_log.md"
          fi
          if [ ! -s "$BODY_FILE" ]; then
            printf 'The production run did not produce a report. The facilitator has been notified.\n' > "$BODY_FILE"
          fi
          # append_personal_mail.py lives on the gh-pages branch itself
          test -f append_personal_mail.py
          # unique id per commit so every push lands as a NEW email
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          python3 append_personal_mail.py \
            --site-dir . \
            --handle "${{ github.event.pull_request.user.login }}" \
            --id "prod-log-pr-${{ github.event.pull_request.number }}-${SHORT_SHA}" \
            --from-name "Alex Rivera" \
            --from-role "Senior SRE" \
            --from-bg "#0b5394" \
            --subject "Re: deployment - production is unhappy again" \
            --category production \
            --body-file "$BODY_FILE" \
            --pr-url "${{ github.event.pull_request.html_url }}"
          git add "personal/${{ github.event.pull_request.user.login }}.json"
          git commit -m "Inbox: production report for @${{ github.event.pull_request.user.login }} (PR #${{ github.event.pull_request.number }})" || echo "nothing to commit"
          git push origin gh-pages

      - name: Upload production score
        uses: actions/upload-artifact@v4
        with:
          name: production-score
          path: prod_log.md

      - name: Auto-review gates and label
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}
          KIMCHI_REVIEW_MODEL: ${{ secrets.KIMCHI_REVIEW_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        id: review
        run: |
          set -e
          PR_BODY=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json body --jq '.body')

          # Re-run visible suite inline so the auto-review decision is self-contained
          REPORT=/tmp/visible.json
          set +e
          python3 -m pytest tests/ --tb=no -q --json-report --json-report-file="$REPORT" >/dev/null 2>&1
          set -e
          if [ -f "$REPORT" ]; then
            V_PASS=$(python3 -c "import json;d=json.load(open('$REPORT'));print(d['summary']['passed'])" 2>/dev/null || echo 0)
            V_TOTAL=$(python3 -c "import json;d=json.load(open('$REPORT'));print(d['summary']['total'])" 2>/dev/null || echo 9)
          else
            V_PASS=0; V_TOTAL=9
          fi

          PYBIN=answers/.verification/auto_review.py
          V_PASS="$V_PASS" V_TOTAL="$V_TOTAL" PR_BODY="$PR_BODY" python3 "$PYBIN"

      - name: Act on auto-review verdict
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACCEPT: ${{ steps.review.outputs.accept }}
          FAILURES: ${{ steps.review.outputs.failures }}
          V_PASS: ${{ steps.review.outputs.vpass }}
          V_TOTAL: ${{ steps.review.outputs.vtotal }}
          PROD_SCORE: ${{ steps.review.outputs.prod_score }}
        run: |
          set -e
          if [ "$ACCEPT" = "yes" ]; then
            gh pr label "$PR_NUMBER" --add accepted --repo "${{ github.repository }}" || true
            printf 'Auto-accepted by the workshop bot.\n\n- Visible suite: %s/%s\n- Production: %s/26\n- CSV matches the reported cost.\n\nThe leaderboard workflow runs next; Sam Carter will mail your inbox once the row lands.\n' "$V_PASS" "$V_TOTAL" "$PROD_SCORE" > /tmp/accept_body.txt
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/accept_body.txt
          else
            printf 'Auto-review blocked. Fix and push again.\n\n**Blocking:**\n' > /tmp/block_body.txt
            echo "$FAILURES" | tr ';' '\n' | sed 's/^/- /' | grep -v '^- $' >> /tmp/block_body.txt
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/block_body.txt
          fi
