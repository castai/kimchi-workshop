name: Production scenario

# Runs against every submission PR in parallel with the visible score.
# The hidden suite is fetched from the private kimchi-workshop-answers
# repo - participants never see the tests, only the production log
# rendered from their results.
#
# pull_request_target: runs in the context of the BASE repository so it
# can read the ANSWERS_REPO_PAT secret. Fork PRs cannot see secrets on
# standard `pull_request` events; this event is the documented pattern
# for workflows that need secrets AND should run for external contributors.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

env:
  KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}

jobs:
  production:
    # Only run against participant submissions. Housekeeping PRs skip.
    if: startsWith(github.event.pull_request.title, '[submission]')
    runs-on: ubuntu-latest
    steps:
      # Check out the PR's HEAD sha explicitly - safe because this workflow
      # only reads test results (never runs the untrusted code in a context
      # with write permissions that could modify the repo).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pytest

      - name: Fetch hidden suite from the private answers repo
        uses: actions/checkout@v4
        with:
          repository: castai/kimchi-workshop-answers
          ref: verification
          path: answers/
          token: ${{ secrets.ANSWERS_REPO_PAT }}
          persist-credentials: false
          sparse-checkout: .verification
          # required for fork PRs: surface the real error if the PAT
          # cannot see the answers repo
          allow-unsafe-pr-checkout: true

      - name: Stage hidden suite
        run: |
          mkdir -p .verification
          cp answers/.verification/test_hidden.py .verification/
          cp answers/.verification/format_prod_log.py .verification/

      - name: Run production scenario
        id: prod
        run: |
          set +e
          python -m pytest .verification/test_hidden.py -q \
            --junitxml=/tmp/prod.xml --tb=line -p no:cacheprovider
          echo "exit=$?" >> $GITHUB_OUTPUT
          python .verification/format_prod_log.py /tmp/prod.xml prod_log.md
          python - <<'EOF'
          import re
          out = open("prod_log.md").read()
          m = re.search(r"Production score: (\d+)/(\d+)", out)
          if m:
              print("passed=" + m.group(1))
              print("total=" + m.group(2))
          EOF
          cat prod_log.md

      - name: Frame production log as an email via Kimchi
        env:
          KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}
        continue-on-error: true
        run: |
          cp answers/.verification/frame_email.py .verification/frame_email.py
          python3 .verification/frame_email.py prod_log.md prod_email_body.txt

      - name: Frame production log as a technical PR comment
        env:
          KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}
        continue-on-error: true
        run: |
          cp answers/.verification/frame_pr_comment.py .verification/frame_pr_comment.py
          python3 .verification/frame_pr_comment.py prod_log.md prod_pr_comment.txt
          cat prod_pr_comment.txt

      - name: "Gate: production score must be at least 15/26"
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import re, sys
          out = open("prod_log.md").read()
          m = re.search(r"Production score: (\d+)/(\d+)", out)
          if not m:
              print("No production score found in log.")
              sys.exit(1)
          passed, total = int(m.group(1)), int(m.group(2))
          if passed < 15:
              print(f"::error::Production score {passed}/{total} below the merge threshold (15). "
                    "Fix the failing areas the log reports and re-run.")
              sys.exit(1)
          print(f"Production gate passed: {passed}/{total}")
          EOF

      - name: Post production log on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let bodyFile = null;
            if (fs.existsSync("prod_pr_comment.txt")) {
              bodyFile = "prod_pr_comment.txt";
            } else if (fs.existsSync("prod_log.md")) {
              bodyFile = "prod_log.md";
            }
            const body = bodyFile ? fs.readFileSync(bodyFile, "utf8") : "Could not parse production results.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Publish production log to the participant's site inbox
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/castai/kimchi-workshop.git" site
          cd site
          git config user.name "kimchi-workshop-bot"
          git config user.email "bot@users.noreply.github.com"
          BODY_FILE="../prod_email_body.txt"
          if [ ! -s "$BODY_FILE" ]; then
            BODY_FILE="../prod_log.md"
          fi
          if [ ! -s "$BODY_FILE" ]; then
            printf 'The production run did not produce a report. The facilitator has been notified.\n' > "$BODY_FILE"
          fi
          # append_personal_mail.py lives on the gh-pages branch itself
          test -f append_personal_mail.py
          # unique id per commit so every push lands as a NEW email
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          python3 append_personal_mail.py \
            --site-dir . \
            --handle "${{ github.event.pull_request.user.login }}" \
            --id "prod-log-pr-${{ github.event.pull_request.number }}-${SHORT_SHA}" \
            --from-name "Alex Rivera" \
            --from-role "Senior SRE" \
            --from-bg "#0b5394" \
            --subject "Re: deployment - production is unhappy again" \
            --category production \
            --body-file "$BODY_FILE" \
            --pr-url "${{ github.event.pull_request.html_url }}"
          git add "personal/${{ github.event.pull_request.user.login }}.json"
          git commit -m "Inbox: production report for @${{ github.event.pull_request.user.login }} (PR #${{ github.event.pull_request.number }})" || echo "nothing to commit"
          git push origin gh-pages

      - name: Upload production score
        uses: actions/upload-artifact@v4
        with:
          name: production-score
          path: prod_log.md

      - name: Auto-review gates and label
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIMCHI_API_KEY: ${{ secrets.KIMCHI_API_KEY }}
          KIMCHI_REVIEW_MODEL: ${{ secrets.KIMCHI_REVIEW_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        id: review
        run: |
          set -e
          PR_BODY=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json body --jq '.body')

          # Pull the latest visible suite score from the score-pr workflow's
          # most recent completed run for this PR. Don't rerun pytest inline
          # (the run here didn't install pinned requirements).
          VISIBLE_TOTAL=9
          V_PASS=0
          for wf_name in "Score submission PR" "Score the pr"; do
            RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow "$wf_name" --branch "$HEAD_BRANCH" --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
            [ -z "$RUN_ID" ] && continue
            mkdir -p /tmp/visible_artifacts
            if gh run download "$RUN_ID" --repo "${{ github.repository }}" --name submission-score -D /tmp/visible_artifacts 2>/dev/null; then
              if [ -f /tmp/visible_artifacts/score.json ]; then
                V_PASS=$(python3 -c "import json;d=json.load(open('/tmp/visible_artifacts/score.json'));print(d.get('tests_passed',0))")
                VISIBLE_TOTAL=$(python3 -c "import json;d=json.load(open('/tmp/visible_artifacts/score.json'));print(d.get('tests_passed',0)+d.get('tests_failed',0))")
                break
              fi
            fi
          done

          PYBIN=answers/.verification/auto_review.py
          V_PASS="$V_PASS" V_TOTAL="$VISIBLE_TOTAL" PR_BODY="$PR_BODY" python3 "$PYBIN"

      - name: Act on auto-review verdict
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACCEPT: ${{ steps.review.outputs.accept }}
          FAILURES: ${{ steps.review.outputs.failures }}
          V_PASS: ${{ steps.review.outputs.vpass }}
          V_TOTAL: ${{ steps.review.outputs.vtotal }}
          PROD_SCORE: ${{ steps.review.outputs.prod_score }}
        run: |
          set -e

          # Find our prior verdict comment on this PR (if any) and delete it,
          # so the new one carries a fresh timestamp + the current date headline
          # instead of just updating in place. This way the participant's
          # activity feed always shows the latest outcome with a date stamp.
          find_prior() {
            gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
              --json comments --jq '.comments[] | select(.author.login == "github-actions[bot]" and (.body | startswith("Auto-review") or startswith("Auto-accepted"))) | .id' \
              | tail -1
          }
          PRIOR_ID=$(find_prior || true)
          if [ -n "$PRIOR_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$PRIOR_ID" -X DELETE || echo "prior verdict delete skipped"
          fi

          # Compose the verdict body. Blocked bodies always carry a per-stage
          # "fix N more" headline so the participant knows exactly how far they
          # are from the new 15/26 production gate.
          PROD_SCORE_INT=${PROD_SCORE:-0}
          REQUIRED_PROD=15
          REMAINING=$((REQUIRED_PROD - PROD_SCORE_INT))
          if [ "$REMAINING" -lt 0 ]; then REMAINING=0; fi

          if [ "$ACCEPT" = "yes" ]; then
            gh pr label "$PR_NUMBER" --add accepted --repo "${{ github.repository }}" || true
            printf 'Auto-accepted by the workshop bot.\n\n- Visible suite: %s/%s\n- Production: %s/26 (need %s)\n- CSV matches the reported cost.\n\nThe leaderboard workflow runs next; Sam Carter will mail your inbox once the row lands.\n' \
              "$V_PASS" "$V_TOTAL" "$PROD_SCORE" "$REQUIRED_PROD" > /tmp/accept_body.txt
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/accept_body.txt
          else
            WHATS_LEFT="**Fix ${REMAINING} more production checks to clear the 15/26 gate.**"
            {
              printf 'Auto-review blocked. Fix and push again.\n\n'
              printf '%s\n\n' "$WHATS_LEFT"
              printf '**Blocking:**\n'
            } > /tmp/block_body.txt
            echo "$FAILURES" | tr ';' '\n' | sed 's/^/- /' | grep -v '^- $' >> /tmp/block_body.txt
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/block_body.txt
          fi

