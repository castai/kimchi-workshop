name: Production scenario

# Runs against every submission PR in parallel with the visible score.
# The hidden suite is fetched from the private kimchi-workshop-answers
# repo - participants never see the tests, only the production log
# rendered from their results.
#
# pull_request_target: runs in the context of the BASE repository so it
# can read the ANSWERS_REPO_PAT secret. Fork PRs cannot see secrets on
# standard `pull_request` events; this event is the documented pattern
# for workflows that need secrets AND should run for external contributors.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      # Check out the PR's HEAD sha explicitly - safe because this workflow
      # only reads test results (never runs the untrusted code in a context
      # with write permissions that could modify the repo).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pytest

      - name: Fetch hidden suite from the private answers repo
        uses: actions/checkout@v4
        with:
          repository: castai/kimchi-workshop-answers
          ref: verification
          path: answers/
          token: ${{ secrets.ANSWERS_REPO_PAT }}
          persist-credentials: false
          sparse-checkout: .verification
          # required for fork PRs: surface the real error if the PAT
          # cannot see the answers repo
          allow-unsafe-pr-checkout: true

      - name: Stage hidden suite
        run: |
          mkdir -p .verification
          cp answers/.verification/test_hidden.py .verification/
          cp answers/.verification/format_prod_log.py .verification/

      - name: Run production scenario
        id: prod
        run: |
          set +e
          python -m pytest .verification/test_hidden.py -q \
            --junitxml=/tmp/prod.xml --tb=line -p no:cacheprovider
          echo "exit=$?" >> $GITHUB_OUTPUT
          python .verification/format_prod_log.py /tmp/prod.xml prod_log.md
          python - <<'EOF'
          import re
          out = open("prod_log.md").read()
          m = re.search(r"Production score: (\d+)/(\d+)", out)
          if m:
              print("passed=" + m.group(1))
              print("total=" + m.group(2))
          EOF
          cat prod_log.md

      - name: Post production log on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("prod_log.md", "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Publish production log to the participant's site inbox
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/castai/kimchi-workshop.git" site
          cd site
          git config user.name "kimchi-workshop-bot"
          git config user.email "bot@users.noreply.github.com"
          BODY_FILE="../prod_log.md"
          if [ ! -s "$BODY_FILE" ]; then
            printf 'The production run did not produce a report. The facilitator has been notified.\n' > "$BODY_FILE"
          fi
          # append_personal_mail.py lives on the gh-pages branch itself
          test -f append_personal_mail.py
          python3 append_personal_mail.py \
            --site-dir . \
            --handle "${{ github.event.pull_request.user.login }}" \
            --id "prod-log-pr-${{ github.event.pull_request.number }}" \
            --from-name "Marcus Okafor" \
            --from-role "Senior SRE, Service Owner" \
            --from-bg "#0b5394" \
            --subject "Production report for PR #${{ github.event.pull_request.number }} — the office has opinions" \
            --category production \
            --body-file "$BODY_FILE" \
            --pr-url "${{ github.event.pull_request.html_url }}"
          git add "personal/${{ github.event.pull_request.user.login }}.json"
          git commit -m "Inbox: production report for @${{ github.event.pull_request.user.login }} (PR #${{ github.event.pull_request.number }})" || echo "nothing to commit"
          git push origin gh-pages

      - name: Upload production score
        uses: actions/upload-artifact@v4
        with:
          name: production-score
          path: prod_log.md
