name: Update leaderboard

# Fires when a facilitator labels a PR "accepted" (the human evaluation
# gate). Fetches the score artifact from that PR's latest scoring run,
# stores it under records/, rebuilds leaderboard.json, and deploys the
# UI to GitHub Pages.
on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  leaderboard:
    if: |
      github.event.label.name == 'accepted' &&
      startsWith(github.event.pull_request.title, '[submission]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          # records/, leaderboard.json, and the docs/ UI all live on
          # gh-pages. challenge is the source of truth for code; the
          # leaderboard lives on the published site branch.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download visible-suite score
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: score-pr.yml
          name: submission-score
          path: download/
          pr: ${{ github.event.pull_request.number }}
          allow_forks: true

      - name: Download production score
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: production.yml
          name: production-score
          path: download/
          pr: ${{ github.event.pull_request.number }}
          allow_forks: true
          if-no-files-found: ignore

      - name: Record the accepted submission
        env:
          HANDLE: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p records
          python - <<'EOF'
          import csv, io, json, math, os, re, subprocess, sys
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen

          row = json.load(open("download/score.json"))
          handle = os.environ["HANDLE"]

          # ---- Participant profile (from join-ledger)
          pfile = os.path.join("participants", "%s.json" % handle)
          pdata = {}
          if os.path.exists(pfile):
              with open(pfile) as f:
                  pdata = json.load(f)
          for k in ("name", "org", "designation", "email"):
              if pdata.get(k):
                  row[k] = pdata[k]
          start_time_iso = pdata.get("start_time") or row.get("submitted_at")

          # ---- Production score (from production-log artifact)
          prod_passed, prod_total = 0, 0
          prod_log = "download/prod_log.md"
          if os.path.exists(prod_log):
              with open(prod_log) as f:
                  md = f.read()
              m = re.search(r"Production score: (\d+)/(\d+)", md)
              if m:
                  prod_passed, prod_total = int(m.group(1)), int(m.group(2))
          row["production_passed"] = prod_passed
          row["production_total"] = prod_total

          # ---- Kimchi usage CSV (real models, requests, cost)
          csv_cost, csv_requests, csv_models, csv_rows = 0.0, 0, [], 0
          head_repo = os.environ.get("HEAD_REPO", "")
          head_branch = os.environ.get("HEAD_BRANCH", "")
          if head_repo and head_branch:
              url = (
                  "https://raw.githubusercontent.com/%s/%s/kimchi-usage.csv"
                  % (head_repo, head_branch)
              )
              req = Request(url, headers={
                  "User-Agent": "kimchi-workshop-bot/1.0",
                  "Accept": "text/csv,*/*;q=0.8",
              })
              try:
                  with urlopen(req, timeout=15) as r:
                      raw = r.read()
                      if raw[:2] == b"\x1f\x8b":
                          import gzip
                          raw = gzip.decompress(raw)
                  rows = list(csv.reader(io.StringIO(raw.decode())))
                  if rows:
                      header = [h.strip().lower().replace(" ", "_")
                                for h in rows[0]]
                      def col(*names):
                          for n in names:
                              if n in header:
                                  return header.index(n)
                              for i, h in enumerate(header):
                                  if n in h:
                                      return i
                          return None
                      cost_i = col("cost_usd", "cost", "spend_usd", "spend")
                      req_i = col("requests", "request_count", "api_calls")
                      model_i = col("model", "model_name")
                      seen_models = set()
                      for dr in rows[1:]:
                          if cost_i is not None and cost_i < len(dr):
                              try:
                                  csv_cost += float(dr[cost_i] or 0)
                              except ValueError:
                                  pass
                          if req_i is not None and req_i < len(dr):
                              try:
                                  csv_requests += int(dr[req_i] or 0)
                              except ValueError:
                                  pass
                          if model_i is not None and model_i < len(dr) \
                                  and dr[model_i]:
                              seen_models.add(dr[model_i])
                      csv_models = sorted(seen_models)
                      csv_rows = len(rows) - 1
              except Exception as e:
                  print("CSV pull failed:", e, file=sys.stderr)

          row["csv_cost_total"] = round(csv_cost, 4)
          row["requests"] = csv_requests
          row["models_used"] = csv_models
          row["csv_rows"] = csv_rows
          if csv_cost:
              row["cost_usd"] = round(csv_cost, 4)

          # ---- Commit count
          commit_count = 0
          try:
              out = subprocess.run(
                  ["gh", "pr", "view", str(os.environ["PR_NUMBER"]),
                   "--repo", os.environ.get("GITHUB_REPOSITORY", "castai/kimchi-workshop"),
                   "--json", "commits"],
                  capture_output=True, text=True,
                  env={**os.environ, "GH_TOKEN": os.environ.get("GITHUB_TOKEN", "")},
              ).stdout
              commit_count = len(json.loads(out).get("commits", []))
          except Exception as e:
              print("commit count fetch failed:", e, file=sys.stderr)
          row["commits"] = commit_count

          # ---- Elapsed time from join-start to accepted-at
          accepted_at = datetime.now(timezone.utc)
          row["accepted_at"] = accepted_at.isoformat()
          elapsed_seconds = 0
          if start_time_iso:
              try:
                  st = datetime.fromisoformat(start_time_iso.replace("Z", "+00:00"))
                  elapsed_seconds = max(0, int((accepted_at - st).total_seconds()))
              except Exception:
                  pass
          row["elapsed_seconds"] = elapsed_seconds
          row["elapsed_hours"] = round(elapsed_seconds / 3600, 2)

          # ---- Codified multi-factor scoring
          # Output-first, with separately-scored discipline and thoroughness
          # signals. Max possible: 116; strong par submission ~85-95.

          visible_passed = row.get("tests_passed", 0)
          visible_total = visible_passed + row.get("tests_failed", 0)
          # (1) Visible tests, 27 points max (9 x 3)
          p_visible = visible_passed * 3
          # (2) Production tests, 26 points max (one point per check)
          p_prod = prod_passed
          # (3) CSV models used, up to 10 points (2 per distinct model, cap 10)
          p_models = min(10, 2 * len(csv_models)) if csv_rows > 0 else 0
          # (4) CSV request count, log-scaled up to 10 points
          #     (1 request = 0, 50+ = 10)
          if csv_requests > 0:
              p_requests = min(10, int(math.log2(csv_requests + 1) * 1.77))
          else:
              p_requests = 0
          # (5) Cost efficiency against a $2 budget, -10 to +10
          #     perfectly-efficient = $0 -> +10; exactly $2 -> +5; $10+ -> -10
          budget = 2.0
          if csv_rows == 0:
              p_cost = 0  # no CSV = no signal either way
          elif csv_cost <= budget:
              p_cost = 10 - 5 * (csv_cost / budget)
          else:
              over = csv_cost - budget
              p_cost = -min(10, over / 1.0)
          # (6) Time-to-accept, -10 to +10 (faster is better, 24h scale)
          #     elapsed <= 2h -> +10; 4h -> +5; 8h -> 0; 24h -> -10
          h = elapsed_seconds / 3600
          if h <= 2: p_time = 10
          elif h <= 4: p_time = 10 - 2.5 * (h - 2)
          elif h <= 8: p_time = 5 - 1.25 * (h - 4)
          elif h <= 24: p_time = -0.9375 * (h - 8)
          else: p_time = -10
          # (7) Commit-discipline: sweet spot is 5-15 commits; up to +8
          c = commit_count
          if 5 <= c <= 15: p_commits = 8
          elif 1 <= c < 5: p_commits = 3 + c
          elif 15 < c <= 30: p_commits = 8 - 0.5 * (c - 15)
          else: p_commits = -5  # >30 = noise
          p_commits = int(p_commits)
          # (8) Quality-of-code (LLM review_score), 0-10 points
          review = row.get("review_score", 0) or 0
          p_quality = int((review / 100.0) * 10)
          # (9) All-challenges-passed bonus (visible 9/9 and production >= 23/26)
          full_clear = (visible_passed == 9 and prod_passed >= 23)
          p_bonus = 5 if full_clear else 0

          breakdown = {
              "visible_tests": p_visible,
              "production_tests": p_prod,
              "models_used": p_models,
              "request_count": p_requests,
              "cost_efficiency": round(p_cost, 2),
              "time_to_accept": round(p_time, 2),
              "commit_discipline": p_commits,
              "code_quality": p_quality,
              "full_clear_bonus": p_bonus,
          }
          points = round(sum(breakdown.values()), 2)
          row["points"] = points
          row["score_breakdown"] = breakdown
          row["scoring_config"] = {
              "budget_usd": budget,
              "production_total": prod_total,
              "visible_total": visible_total,
              "scoring_version": "v2",
          }
          row["status"] = "accepted"

          name = "%s-%s.json" % (row.get("event", "default"),
                                 row.get("attendee", "unknown"))
          with open("records/" + name, "w") as f:
              json.dump(row, f, indent=2)
          print("recorded", name, "points=", points)
          print("  breakdown:", breakdown)
          with open("record_for_inbox.json", "w") as f:
              json.dump(row, f)
          EOF

      - name: Rebuild leaderboard
        run: python scripts/aggregate.py --records records/ --out leaderboard.json

      - name: Build UI config and stage docs
        run: |
          python scripts/build_ui_config.py --repo "${{ github.repository }}" \
            --board leaderboard.json --out docs/config.json
          cp leaderboard.json docs/leaderboard.json
          # index.html ships in docs/ already; config + board are generated

      - name: Comment the score on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const rec = JSON.parse(fs.readFileSync("record_for_inbox.json", "utf8"));
            const board = JSON.parse(fs.readFileSync("leaderboard.json", "utf8"));
            const event = rec.event || "default";
            const ranked = (board.events[event] && board.events[event].rows) || [];
            const me = ranked.find((r) => r.attendee === rec.attendee);
            const rank = me ? me.rank : "?";
            const b = rec.score_breakdown || {};
            const fmt = (v) => (typeof v === "number" ? v.toFixed(2) : String(v));
            const body = [
              "### 🏆 Submission accepted",
              "",
              "| | |",
              "| --- | --- |",
              "| **Points** | **" + fmt(rec.points) + "** |",
              "| Rank in **" + event + "** | #" + rank + " of " + ranked.length + " |",
              "| Visible | " + rec.tests_passed + "/" + ((rec.tests_passed||0)+(rec.tests_failed||0)) + " |",
              "| Production | " + (rec.production_passed||0) + "/" + (rec.production_total||0) + " |",
              "| CSV cost | $" + (rec.cost_usd||0).toFixed(2) + " across " + (rec.requests||0) + " requests |",
              "| Models used | " + ((rec.models_used||[]).length) + " (" + (rec.models_used||[]).join(", ") + ")" + " |",
              "| Commits | " + (rec.commits||0) + " |",
              "| Time to accept | " + fmt(rec.elapsed_hours||0) + " h |",
              "",
              "**Score breakdown**",
              "| Signal | Points |",
              "| --- | --- |",
              "| Visible tests | " + fmt(b.visible_tests||0) + " |",
              "| Production tests | " + fmt(b.production_tests||0) + " |",
              "| Model diversity | " + fmt(b.models_used||0) + " |",
              "| Request throughput | " + fmt(b.request_count||0) + " |",
              "| Cost efficiency | " + fmt(b.cost_efficiency||0) + " |",
              "| Time to accept | " + fmt(b.time_to_accept||0) + " |",
              "| Commit discipline | " + fmt(b.commit_discipline||0) + " |",
              "| Code quality | " + fmt(b.code_quality||0) + " |",
              "| Full-clear bonus | " + fmt(b.full_clear_bonus||0) + " |",
              "",
              "See the live leaderboard: " + context.payload.repository.html_url + "#leaderboard",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.number,
              body,
            });

      - name: Publish acceptance email to the participant's site inbox
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTENDEE: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -e
          python3 - <<'EOF'
          import json
          row = json.load(open("record_for_inbox.json"))
          event = row.get("event", "default")
          board = json.load(open("leaderboard.json"))
          ranked = (board.get("events", {}).get(event) or {}).get("rows") or []
          me = next((r for r in ranked if r.get("attendee") == row.get("attendee")), None)
          rank = me.get("rank") if me else "?"
          total = len(ranked)
          b = row.get("score_breakdown", {}) or {}
          breakdown_lines = "\n".join(
              "  - %s: %.2f" % (k.replace("_", " "), float(v or 0))
              for k, v in b.items()
          )
          spent_usd = float(row.get("cost_usd", 0) or 0)
          body = (
              "Hi —\n"
              "\n"
              "Accepted. The facilitator has reviewed the PR, the suite, and the production "
              "story. Your submission is on the board.\n"
              "\n"
              "  Points: " + str(row.get("points", 0)) + "\n"
              "  Rank in " + str(event) + ": #" + str(rank) + " of " + str(total) + "\n"
              "  Visible checks: " + str(row.get("tests_passed", 0)) + " passed\n"
              "  Production checks: " + str(row.get("production_passed", 0)) + "/"
              + str(row.get("production_total", 0)) + "\n"
              "  Your spend: $" + "%.2f" % spent_usd + " over "
              + str(row.get("requests", 0)) + " requests\n"
              "  Models used: " + (", ".join(row.get("models_used", [])) or "none") + "\n"
              "  Commits on the PR: " + str(row.get("commits", 0)) + "\n"
              "  Time since join: %.2f hours\n" % float(row.get("elapsed_hours", 0) or 0)
              "\n"
              "Score breakdown:\n" + breakdown_lines + "\n"
              "\n"
              "Now that the workshop considers you 'done', here is the full handoff:\n"
              "\n"
              "  1. Usage metrics: your Kimchi key spend lives in\n"
              "     https://app.kimchi.dev/usage . Download the CSV from that page —\n"
              "     the CSV is what the leaderboard uses to attribute your cost.\n"
              "     If you haven't uploaded it yet, drop it as an attachment on your PR.\n"
              "\n"
              "  2. Post-acceptance scan: the production workflow re-runs nightly\n"
              "     against your branch. If a regression slips in before Monday,\n"
              "     it will fire the same incident engine we used here — useful\n"
              "     context, no action needed from you unless that email pings you.\n"
              "\n"
              "  3. Next steps: hand the repo to the next engineer on your team.\n"
              "     They start at the same briefing inbox you did.\n"
              "\n"
              "The PR stays open in the queue for audit, but the leaderboard row is permanent. "
              "If you want to see the production story that got you here, check your inbox — "
              "Alex sent it already.\n"
              "\n"
              "Now go help the next person. The company is in good hands.\n"
              "\n"
              "— Sam\n"
          )
          with open("acceptance_body.txt", "w") as f:
              f.write(body)
          print("wrote acceptance_body.txt")
          EOF

          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/castai/kimchi-workshop.git" site
          cd site
          git config user.name "kimchi-workshop-bot"
          git config user.email "bot@users.noreply.github.com"
          python3 append_personal_mail.py \
            --site-dir . \
            --handle "$ATTENDEE" \
            --id "accepted-pr-${PR_NUMBER}" \
            --from-name "Sam Carter" \
            --from-role "VP Engineering" \
            --from-bg "#b3261e" \
            --subject "Submission accepted - you ranked" \
            --category score \
            --body-file ../acceptance_body.txt \
            --pr-url "$PR_URL"
          git add "personal/${ATTENDEE}.json"
          git commit -m "Inbox: acceptance for @${ATTENDEE} (PR #${PR_NUMBER})" || echo "nothing to commit"
          git push origin gh-pages

      - name: Commit records and leaderboard
        run: |
          git config user.name "workshop-bot"
          git config user.email "workshop-bot@users.noreply.github.com"
          git add records/ leaderboard.json
          git commit -m "Leaderboard: accept PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.user.login }})" || echo "nothing to commit"
          for i in 1 2 3; do
            if git pull --rebase origin gh-pages && git push origin HEAD:gh-pages; then
              break
            fi
            echo "push attempt $i hit a race; retrying in 5s"
            sleep 5
          done

      - name: Deploy UI to Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          # keep_files: the site also carries briefings/, personal/,
          # append_personal_mail.py, and other assets written directly
          # to gh-pages by other workflows. Never wipe what we do not own.
          keep_files: true
