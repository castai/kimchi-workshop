name: Score submission PR

# SECURITY NOTE (Wiz finding 2026-10-27): this workflow runs the visible
# AND hidden suites against untrusted PR code. It runs on pull_request:
# (NOT pull_request_target:) so the GITHUB_TOKEN it gets is scoped to the
# PR's own repository/fork with read-only permissions against the base.
# There are NO org secrets in scope, and no repo secrets either. Any
# malicious code a participant smuggles into the PR (conftest.py, app.py,
# etc.) runs in a sandboxed context with zero useful credentials.
#
# The production reporting pipeline (production.yml) consumes this run's
# artifacts via workflow_run: without ever executing the PR code.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write  # so we can publish artifacts the downstream workflow consumes

jobs:
  score:
    # Only gate participant submissions. Housekeeping PRs (workshop
    # infrastructure) skip scoring entirely.
    if: startsWith(github.event.pull_request.title, '[submission]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install test deps directly - never the PR's requirements.txt, whose
      # setup could execute untrusted PR code. The visible suite imports the
      # app (flask), and the hidden suite uses requests.
      - run: pip install pytest flask requests

      # Visible suite (the score gate)
      - name: Score the submission (visible suite)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > body.txt
          python scripts/score_pr.py \
            --pr "${{ github.event.pull_request.number }}" \
            --author "${{ github.event.pull_request.user.login }}" \
            --url "${{ github.event.pull_request.html_url }}" \
            --title "$PR_TITLE" \
            --body-file body.txt \
            --out score.json --summary summary.md

      # Fetch the hidden test suite from the answers repo. We use a Gist
      # URL rotated per event so a leak of the answers repo content-level
      # PAT is not required here. The Gist URL lives in an ORG SECRET
      # (HIDDEN_TESTS_GIST), which is fetched via curl + ORG-level PAT.
      # Even if the Gist URL leaks, the worst case is the hidden tests
      # becoming public - no secrets exposed.
      - name: Fetch hidden test suite
        env:
          HIDDEN_TESTS_GIST: ${{ secrets.HIDDEN_TESTS_GIST }}
        run: |
          mkdir -p .verification
          curl -sSfL "$HIDDEN_TESTS_GIST" -o /tmp/hidden_tests.tar.gz \
            || echo "::warning::could not fetch hidden tests; continuing with visible suite only"
          if [ -s /tmp/hidden_tests.tar.gz ]; then
            tar xzf /tmp/hidden_tests.tar.gz -C .verification \
              && ls .verification/ \
              || echo "::warning::hidden tests tarball malformed"
          fi

      - name: Run production scenario (hidden suite)
        if: always()
        continue-on-error: true
        run: |
          set +e
          if [ -f .verification/test_hidden.py ]; then
            python -m pytest .verification/test_hidden.py -q \
              --junitxml=/tmp/prod.xml --tb=line -p no:cacheprovider
            echo "exit=$?" >> $GITHUB_OUTPUT
            python .verification/format_prod_log.py /tmp/prod.xml prod_log.md 2>/dev/null \
              || python .verification/format_prod_log.py /tmp/prod.xml prod_log.md
          else
            # Hidden tests unavailable (fork PRs receive no secrets, so the
            # Gist fetch above always fails there). Emit an explicitly-marked
            # UNAVAILABLE log: the marker line is the contract production.yml
            # detects, and the log must NOT match the downstream score regex
            # ("Production score: N/N") so nothing treats it as a real 0/26
            # run. NOTE: printf, not a heredoc - YAML block-scalar
            # indentation breaks <<EOF terminators (parse-time syntax error,
            # masked by continue-on-error).
            printf 'PRODUCTION_SUITE: UNAVAILABLE (fork run; hidden tests not fetched)\nProduction score: unavailable/26\nVisible suite ran; hidden stage data not yet wired up.\n' > prod_log.md
          fi
          cat prod_log.md

      - name: Upload score artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-score
          path: |
            score.json
            summary.md
          if-no-files-found: ignore

      - name: Upload production report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-prod-score
          path: prod_log.md
          if-no-files-found: ignore

      - name: Show summary
        if: always()
        run: cat summary.md || echo "no summary produced"
